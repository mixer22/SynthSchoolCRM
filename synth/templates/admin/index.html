{% extends "admin/base_site.html" %}

{% block content %}

<style>
.container {
    max-width: 1100px;
    margin: 30px auto;
    padding: 0 10px;
    font-family: Arial, sans-serif;
}

/* HEADER */
h1 {
    font-size: 30px;
    margin-bottom: 6px;
}

.subtitle {
    color: #6b7280;
    margin-bottom: 25px;
}

/* GRID */
.grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 18px;
}

/* CARD */
.card {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: flex-start;

    padding: 22px;
    border-radius: 16px;
    text-decoration: none;

    color: white;
    font-size: 16px;
    font-weight: 600;

    transition: 0.2s;
    box-shadow: 0 10px 25px rgba(0,0,0,0.08);
}

.card:hover {
    transform: translateY(-4px) scale(1.02);
    box-shadow: 0 15px 35px rgba(0,0,0,0.12);
}

/* COLORS */
.blue { background: linear-gradient(135deg, #6366f1, #4f46e5); }
.green { background: linear-gradient(135deg, #22c55e, #16a34a); }
.cyan { background: linear-gradient(135deg, #0ea5e9, #0284c7); }
.purple { background: linear-gradient(135deg, #a855f7, #7c3aed); }

/* ICON */
.icon {
    font-size: 22px;
    margin-bottom: 10px;
}

.label {
    font-size: 18px;
}

.desc {
    font-size: 13px;
    opacity: 0.85;
    margin-top: 6px;
    font-weight: 400;
}
</style>

<!-- GRID -->
<div class="grid">

    <!-- Расписание -->
    <a href="/admin/schedule/" class="card blue">
        <div class="icon">📅</div>
        <div class="label">Расписание</div>
        <div class="desc">Все занятия и временные слоты</div>
    </a>

        <!-- Статистика -->
    <a href="/admin/stats/" class="card purple">
        <div class="icon">📊</div>
        <div class="label">Аналитика</div>
        <div class="desc">Посещения, абонементы и рост школы</div>
    </a>

    <!-- Группы -->
    <a href="/admin/groups/" class="card green">
        <div class="icon">👥</div>
        <div class="label">Группы</div>
        <div class="desc">Список групп и управление учениками</div>
    </a>

    <!-- Ученики -->
    <a href="/admin/students/" class="card cyan">
        <div class="icon">👤</div>
        <div class="label">Ученики</div>
        <div class="desc">Список учеников и профили</div>
    </a>
</div>

{% endblock %}
