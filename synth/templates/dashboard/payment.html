<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<div class="max-w-xl mx-auto mt-10 glass soft-shadow rounded-3xl p-8 text-center">

    <h2 class="text-2xl font-semibold mb-4">Оплата абонемента</h2>

    {% if subscription %}
        <div class="text-slate-600 mb-6">
            {{ subscription.total_lessons }} занятий
        </div>
    {% endif %}

    <!-- QR -->
    <div class="flex justify-center mb-6">
        <img src="/static/qr.png" class="w-56 h-56 rounded-xl shadow">
    </div>

    <div class="text-sm text-slate-500 mb-6">
        Отсканируйте QR-код и оплатите абонемент
        После оплаты нажмите кнопку ниже
    </div>

    <form method="post">
        {% csrf_token %}
        <button class="px-6 py-3 bg-indigo-600 text-white rounded-xl">
            Я оплатил
        </button>
    </form>

</div>
</body>
</html>
